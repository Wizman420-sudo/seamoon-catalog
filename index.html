      'パスワードが違います。もう一度入力してください。','作品一覧を読み込めませんでした。もう一度お試しください。','安全な接続に対応するブラウザで開いてください。','言語',
      'パスワードを入力してください','パスワードを表示','パスワードを隠す','背景動画を再生','背景動画を一時停止']

  const find = id => document.getElementById(id);

  const reveal = find('reveal');

  const canvas = find('opening-frames');
  const shell = document.querySelector('.shell');
  const viewport = window.visualViewport || window;
  function fitEntry() {

  }
  fitEntry();
  viewport.addEventListener('resize', fitEntry);
  const preference = 'seamoon-catalog-language';
  let notice = 0, busy = false, packed;

  function loadSheet(index) {

        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => resolve(null);
        image.src = 'portal-queen-frames-' + (index + 1) + '.webp';
      });
      sheets.set(index, loading);
    }
    return sheets.get(index);
  }
  async function drawFrame(run) {

    let sheet = await loadSheet(index);
    if (!sheet && run === generation) {

      sheet = await loadSheet(index);
    }
    if (run !== generation) return;
    const ctx = canvas.getContext('2d');

      wantsFilm = false;

      return;

  }
  function updateMotion() {

      film.pause();
      if (film.hasAttribute('src')) {
        film.removeAttribute('src');
        film.load();
      }
      canvas.hidden = false;
    }
    if (!wantsFilm || document.hidden) {
      film.pause();
      return;
    }
    if (useFrames) {
      drawFrame(run);
      return;
    }

    film.play()?.catch(() => { if (run === generation) switchToFrames(); });

  function onPageShow(event) {

  }

  film.addEventListener('playing', () => {
    if (!useFrames) { clearTimeout(timer); stage.classList.add('has-frame'); }
  });

    wantsFilm = !wantsFilm;

  document.addEventListener('WeixinJSBridgeReady', switchToFrames, { once: true });
  window.addEventListener('pageshow', onPageShow);
  function render() {
    const words = copy[menu.value];
    document.documentElement.lang = menu.value;
    document.title = words[0];
    menu.setAttribute('aria-label', words[7]);
    find('password-label').textContent = words[1]; find('enter-text').textContent = words[busy ? 3 : 2];
    field.placeholder = words[8];

  menu.addEventListener('change', () => {
    try { localStorage.setItem(preference, menu.value); } catch {}
    render();
  });
  reveal.addEventListener('click', () => {
    field.type = field.type === 'password' ? 'text' : 'password';
    render();
  });
  field.addEventListener('input', () => {

  async function load() {
    const response = await fetch('catalog-locked.bin?v=8c398a2dcc40c44f5a05', {credentials:'omit', referrerPolicy:'no-referrer'});
    if (!response.ok) throw new Error('Unavailable');
    const data = new Uint8Array(await response.arrayBuffer());
    const boundary = data.subarray(0, 2048).indexOf(10);

    return {header:JSON.parse(new TextDecoder().decode(data.subarray(0, boundary))), ciphertext:data.subarray(boundary + 1)};
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (busy || !window.crypto?.subtle) return;
    if (!field.value) {
      notice = 8; field.setAttribute('aria-invalid', 'true'); render(); field.focus();
      return;
    }
    const password = field.value;
    busy = true; notice = 0; field.removeAttribute('aria-invalid'); render();

      packed = packed || await load();
      const {header, ciphertext} = packed;
      const hash = await engine.hashPassword(password, header.salt);
      const result = await codec.decode(header.wrappedKey, hash, header.salt, 2);
      if (!result.success) {
        notice = 4; field.setAttribute('aria-invalid', 'true'); field.focus(); field.select();
        return;
      }

      const clear = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(header.iv)}, key, ciphertext);
      const catalog = JSON.parse(new TextDecoder().decode(clear));
      const urls = new Map();
      for (const [name, cover] of Object.entries(catalog.covers)) {
        urls.set(name, URL.createObjectURL(new Blob([bytes(cover)], {type:'image/webp'})));
      }
      const html = catalog.html.replace(/(href|src)="([foms]\d{3}-\d+-[0-9a-f]{8}\.webp)"/g, (_, attr, name) => {
        if (!urls.has(name)) throw new Error('Missing cover');
        return attr + '="' + urls.get(name) + '"';
      });
      const address = location.href;
      field.value = ''; packed = null;
      wantsFilm = false;
      updateMotion();
      sheets.clear();
      document.removeEventListener('visibilitychange', updateMotion);
      document.removeEventListener('WeixinJSBridgeReady', switchToFrames);
      window.removeEventListener('pageshow', onPageShow);
      viewport.removeEventListener('resize', fitEntry);
      document.open();
      if (location.href !== address) history.replaceState(null, '', address);
      document.write(html);
      document.close();
    } catch { packed = null; notice = 5; }
    finally { if (form.isConnected) { busy = false; render(); } }
  });
})();
