.entry{width:min(830px,100%);display:grid;grid-template-columns:.88fr 1.12fr;border:1px solid #674753;box-shadow:0 22px 65px #0b080c80;background:#1a131a}
.portrait{margin:0;position:relative;min-height:410px;background:#211319 url("art-throne.webp") center 32% / cover no-repeat;border-right:1px solid #674753}
.portrait::after{content:"";position:absolute;inset:9px;border:1px solid #d6adab60;pointer-events:none}
.panel{align-self:center;padding:clamp(26px,4.5vw,62px)}
h1{font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;font-size:clamp(2rem,4vw,2.85rem);line-height:1.15;letter-spacing:.015em;font-weight:500;margin:0 0 .7rem}
.intro{color:#d6bdc6;line-height:1.6;margin:0 0 2rem}
label{display:block;font-size:.9rem;margin:0 0 .5rem;color:#f0dde1}
input{width:100%;height:47px;padding:0 .8rem;background:#100d12;border:1px solid #745461;border-radius:4px;color:#fff;font-size:16px}
button{display:block;width:100%;min-height:46px;margin:.85rem 0 0;border:1px solid #e2b8c6;background:#e4bbc9;color:#28121d;border-radius:4px;font-weight:650;cursor:pointer}
button:hover{background:#efcdda}button:disabled{opacity:.65;cursor:wait}
:focus-visible{outline:2px solid #f5cade;outline-offset:3px}
#status{font-size:.88rem;line-height:1.5;min-height:1.5em;margin:.65rem 0 0;color:#ffbbce}

 header{height:58px}.brand{font-size:1.7rem}.brand img{width:26px;height:26px}

 .entry{grid-template-columns:1fr;max-width:410px}.portrait{min-height:0;height:clamp(125px,23svh,220px);border:0;border-bottom:1px solid #674753;background-position:50% 23%}
 .panel{padding:25px 23px 18px}.intro{margin-bottom:1.2rem}
}

<noscript>请开启 JavaScript 后访问目录。</noscript>
</section></div></main>
